asyncapi: 3.0.0
info:
  title: Warmhouse Devices Telemetry Events
  version: 1.0.0
  description: Канал для передачи сырых событий телеметрии от устройств умного дома.
defaultContentType: application/json
servers:
  kafka-telemetry:
    host: kafka.warmhouse.ru:9092
    protocol: kafka
    description: Kafka-брокер для телеметрии
channels:
  device.events:
    address: device.events
    messages:
      publishTelemetry.message:
        $ref: '#/components/messages/TelemetryEvent'
    description: Топик для сырых событий телеметрии
operations:
  publishTelemetry:
    action: receive
    channel:
      $ref: '#/channels/device.events'
    summary: Получение события телметрии
    messages:
      - $ref: '#/channels/device.events/messages/publishTelemetry.message'
components:
  messages:
    TelemetryEvent:
      name: TelemetryEvent
      title: Событие телеметрии устройства
      summary: Сообщение с данными, полученными напрямую от устройства
      payload:
        type: object
        required:
          - deviceId
          - timestamp
          - metricType
          - value
        properties:
          deviceId:
            type: integer
            description: ID устройства
            example: 123
          deviceType:
            type: string
            enum:
              - sensor
              - switch
              - thermostat
              - camera
            description: Тип устройства
            example: sensor
          timestamp:
            type: string
            format: date-time
            description: Время сбора данных на устройстве (UTC)
            example: '2024-03-20T15:30:45Z'
          metricType:
            type: string
            enum:
              - temperature
              - humidity
              - power
              - motion
              - voltage
            description: Тип метрики
            example: temperature
          value:
            oneOf:
              - type: number
                format: float
              - type: boolean
              - type: string
            description: Значение метрики
            example: 23.5
          unit:
            type: string
            description: Единица измерения
            example: °C
          additionalData:
            type: object
            additionalProperties: true
            description: Дополнительные технические параметры
            example:
              batteryLevel: 85
              signalStrength: -65
        example:
          deviceId: a1b2c3d4e5f67890
          deviceType: sensor
          timestamp: '2024-03-20T15:30:45Z'
          metricType: temperature
          value: 23.5
          unit: °C
          additionalData:
            batteryLevel: 85
            firmwareVersion: 2.1.4
