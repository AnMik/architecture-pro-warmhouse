version: '3.8'

services:

  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      PGUSER: "postgres"
    networks:
      - smarthome-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "smarthome"]
      interval: 3s
      timeout: 3s
      retries: 5

  temperature-api:
    build:
      context: ./smarthome-api
      dockerfile: smarthome-api/Dockerfile
    container_name: temperature-api
    hostname: temperature-api
    ports:
      - "8081:8081"
    networks:
      - smarthome-network

  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    hostname: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/smarthome"
      TEMPERATURE_API_URL: "http://temperature-api:8081"
    ports:
      - "8082:8082"
    restart: unless-stopped
    networks:
      - smarthome-network

  telemetry-api:
    build:
      context: ./telemetry-api
      dockerfile: telemetry-api/Dockerfile
    container_name: telemetry-api
    hostname: telemetry-api
    depends_on:
      app:
        condition: service_started
    ports:
      - "8084:8084"
    networks:
      - smarthome-network

  sensor-api:
    build:
      context: ./sensor-api
      dockerfile: sensor-api/Dockerfile
    container_name: sensor-api
    hostname: sensor-api
    depends_on:
      telemetry-api:
        condition: service_started
    environment:
      TELEMETRY_API_URL: "http://telemetry-api:8084"
    ports:
      - "8083:8083"
    networks:
      - smarthome-network

  proxy-api:
    build:
      context: ./proxy-api
      dockerfile: proxy-api/Dockerfile
    container_name: proxy-api
    depends_on:
      sensor-api:
        condition: service_started
    environment:
      LEGACY_API_URL: "http://smarthome-app:8082"
      SENSOR_API_URL: "http://sensor-api:8083"
      TELEMETRY_API_URL: "http://telemetry-api:8084"
    ports:
      - "8080:8080"
    networks:
      - smarthome-network

volumes:
  postgres_data:

networks:
  smarthome-network:
    driver: bridge